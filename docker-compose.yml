      - --http.corsdomain=https://localhost:3000
      - --http.vhosts=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/root/jwt-secret
      - --port=30303
      - --bootnodes=enode://${BOOTNODE_ENODE}@bootnode:30303
      - --mine
      - --miner.etherbase=0x1785Cc2f7b85F90daD33e712498425cF5C2701cE
      - --syncmode=full
      - --gcmode=archive
      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble
