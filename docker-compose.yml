      - --mine
      - --miner.etherbase=0x4F096CBeAFc373734Bd4e412579CDc16DA228306
      - --syncmode=full
      - --gcmode=archive
      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble
      - --txpool.globalslots=4096
      - --txpool.globalqueue=1024

  validator4:
