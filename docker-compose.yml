      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble

  fullnode2:
    <<: *fullnode-defaults
    container_name: fn2
    volumes:
      - ./nodes/fullnode2:/root/.ethereum:rw
      - ./genesis.json:/root/genesis.json:ro
      - ./jwt-secret:/root/jwt-secret:ro
    command:
      - --datadir=/root/.ethereum
      - --networkid=2026
      - --http
      - --http.addr=127.0.0.1
