      - --datadir=/root/.ethereum
      - --networkid=2026
      - --http
      - --http.addr=127.0.0.1
      - --http.port=8545
      - --http.api=eth,web3,net,txpool
      - --http.corsdomain=https://localhost:3000
      - --http.vhosts=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/root/jwt-secret
      - --port=30303
