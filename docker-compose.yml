      - --http.vhosts=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/root/jwt-secret
      - --port=30303
      - --bootnodes=enode://${BOOTNODE_ENODE}@bootnode:30303
      - --mine
      - --miner.etherbase=0x8B801d7881e76D6715D0f028cFf4A88bD173B85D
      - --syncmode=full
      - --gcmode=archive
      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble
      - --txpool.globalslots=4096
      - --txpool.globalqueue=1024

  validator3:
