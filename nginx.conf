# ============================================================
# NGINX — Reverse Proxy TLS pour Geth Nodes
# TLS 1.3 + mTLS optionnel + Load Balancing
# ============================================================

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Timeouts securises
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65;
    send_timeout 10s;

    # Limites de taille
    client_max_body_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # Headers securite
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logs JSON (pour Loki/ELK)
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_addr",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Upstream — Load balancing round-robin sur les validateurs
    upstream geth_validators {
        least_conn;
        server validator1:8545 max_fails=3 fail_timeout=30s;
        server validator2:8545 max_fails=3 fail_timeout=30s;
        server validator3:8545 max_fails=3 fail_timeout=30s;
        server validator4:8545 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream — Fullnodes (lecture seule, pas de minage)
    upstream geth_fullnodes {
        least_conn;
        server fullnode1:8545 max_fails=3 fail_timeout=30s;
        server fullnode2:8545 max_fails=3 fail_timeout=30s;
        server fullnode3:8545 max_fails=3 fail_timeout=30s;
        server fullnode4:8545 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # ============================================================
    # SERVEUR RPC — TLS 1.3 + Client Cert Optionnel
    # ============================================================
    server {
        listen 8545 ssl;
        server_name localhost;

        # TLS 1.3 uniquement
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_trusted_certificate /etc/nginx/ssl/ca.crt;

        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers off;

        # mTLS optionnel (commenter pour desactiver)
        # ssl_verify_client optional;
        # ssl_client_certificate /etc/nginx/ssl/ca.crt;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Rate limiting
        limit_req zone=api burst=200 nodelay;

        # Proxy vers les validateurs (ecriture + lecture)
        location / {
            proxy_pass http://geth_validators;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si mTLS active, transmettre le cert client
            # proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
            # proxy_set_header X-SSL-Client-I-DN $ssl_client_i_dn;
            # proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
            # proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        }
    }

    # ============================================================
    # SERVEUR WEBSOCKET (optionnel)
    # ============================================================
    server {
        listen 8546 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.3;

        location / {
            proxy_pass http://geth_fullnodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
