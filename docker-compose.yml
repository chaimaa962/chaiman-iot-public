version: '3.8'

# ============================================================
# CHAIMAN IoT BLOCKCHAIN — Production Hardened
# 4 Validators + 4 Fullnodes | Geth stable (v1.17.x)
# ============================================================

x-validator-defaults: &validator-defaults
  image: ethereum/client-go:stable
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4G
      reservations:
        cpus: '1.0'
        memory: 2G
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8545 --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_syncing\",\"params\":[],\"id\":1}' --header='Content-Type: application/json' 2>/dev/null | grep -q false || wget -qO- http://localhost:8545 --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' --header='Content-Type: application/json' 2>/dev/null | grep -q '0x'"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  networks:
    - blockchain-internal

x-fullnode-defaults: &fullnode-defaults
  image: ethereum/client-go:stable
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.5'
        memory: 3G
      reservations:
        cpus: '0.5'
        memory: 1G
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8545 --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_syncing\",\"params\":[],\"id\":1}' --header='Content-Type: application/json' 2>/dev/null | grep -q false || wget -qO- http://localhost:8545 --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' --header='Content-Type: application/json' 2>/dev/null | grep -q '0x'"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  networks:
    - blockchain-internal

services:
  # ============================================================
  # BOOTNODE
  # ============================================================
  bootnode:
    image: ethereum/client-go:stable
    container_name: bootnode
    restart: unless-stopped
    command:
      - --nodekeyhex=${BOOTNODE_KEY}
      - --nat=none
      - --port=30303
      - --networkid=2026
      - --verbosity=3
    ports:
      - "30303:30303/udp"
      - "30303:30303/tcp"
    networks:
      - blockchain-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # VALIDATEURS (4) — Sans --unlock, sans --allow-insecure-unlock
  # ============================================================
  validator1:
    <<: *validator-defaults
    container_name: v1
    volumes:
      - ./nodes/validator1:/root/.ethereum:rw
      - ./genesis.json:/root/genesis.json:ro
      - ./jwt-secret:/root/jwt-secret:ro
    command:
      - --datadir=/root/.ethereum
      - --networkid=2026
      - --http
      - --http.addr=127.0.0.1
      - --http.port=8545
      - --http.api=eth,web3,net,txpool
      - --http.corsdomain=https://localhost:3000
      - --http.vhosts=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/root/jwt-secret
      - --port=30303
      - --bootnodes=enode://${BOOTNODE_ENODE}@bootnode:30303
      - --mine
      - --miner.etherbase=0x4CB1a954687ADd5a72e7faaFA13D831753F2a7E9
      - --syncmode=full
      - --gcmode=archive
      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble
      - --txpool.globalslots=4096
      - --txpool.globalqueue=1024

  validator2:
    <<: *validator-defaults
    container_name: v2
    volumes:
      - ./nodes/validator2:/root/.ethereum:rw
      - ./genesis.json:/root/genesis.json:ro
