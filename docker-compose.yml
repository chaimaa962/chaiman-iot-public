      - --http.corsdomain=https://localhost:3000
      - --http.vhosts=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/root/jwt-secret
      - --port=30303
      - --bootnodes=enode://${BOOTNODE_ENODE}@bootnode:30303
      - --syncmode=full
      - --verbosity=3
      - --snapshot=false
      - --db.engine=pebble

  # ============================================================
  # NGINX PROXY — TLS 1.3 + Load Balancing
  # ============================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./nginx/ssl/server.key:/etc/nginx/ssl/server.key:ro
      - ./nginx/ssl/ca.crt:/etc/nginx/ssl/ca.crt:ro
    networks:
      - blockchain-internal
    depends_on:
      - validator1
      - validator2
      - validator3
      - validator4
      - fullnode1
      - fullnode2
      - fullnode3
      - fullnode4
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  blockchain-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
